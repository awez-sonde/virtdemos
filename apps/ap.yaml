apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhelvm
  namespace: openshift-gitops
spec:
  destination:
    namespace: vm-gitops
    server: "https://kubernetes.default.svc"
  project: default
  source:
    path: vms/rhel
    repoURL: "https://github.com/awez-sonde/virtdemos.git"
    targetRevision: main
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
